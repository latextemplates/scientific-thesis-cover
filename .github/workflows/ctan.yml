name: CTAN

# Check that the CTAN submission archive can be built (release.sh):
# pandoc converts README.md to the documentation PDF and ctanify bundles
# everything into scientific-thesis-cover.tar.gz. This does not upload to
# CTAN; that step stays manual.

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  ctanify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install pandoc and ctanify's Perl dependency
        uses: gerlero/apt-install@c0fa73fe5c4a22deecf6d629565be92a15dd2026 # v1.3.12
        with:
          packages: pandoc libfile-copy-recursive-perl

      - name: Install TeX Live
        uses: zauguin/install-texlive@c9f3ea3d51b2e04d092c4f9d208a19542d5dabcf # v4.5.0
        with:
          package_file: tl_packages_ctan

      # install-texlive does not refresh the font map or hyphenation
      # patterns after installing packages, so the Type1 Computer Modern
      # fonts are not found and pdftex falls back to (missing) bitmap fonts.
      # See https://github.com/zauguin/install-texlive/issues/54
      - name: Refresh font maps and hyphenation
        run: |
          updmap-sys
          tlmgr generate language --rebuild-sys

      - name: Build the CTAN archive
        run: ./release.sh

      - name: Upload CTAN archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ctan-archive
          path: scientific-thesis-cover.tar.gz
