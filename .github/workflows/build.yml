name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install TeX Live
        uses: zauguin/install-texlive@c9f3ea3d51b2e04d092c4f9d208a19542d5dabcf # v4.5.0
        with:
          package_file: tl_packages

      # install-texlive does not refresh the font map or hyphenation
      # patterns after installing packages, so the Type1 Computer Modern
      # fonts are not found and pdftex falls back to (missing) bitmap fonts.
      # See https://github.com/zauguin/install-texlive/issues/54
      - name: Refresh font maps and hyphenation
        run: |
          updmap-sys
          tlmgr generate language --rebuild-sys

      - name: Compile demo
        run: pdflatex -interaction=nonstopmode -halt-on-error demo.tex

      - name: Compile tests
        working-directory: tests
        run: |
          for f in \
            TEST_english_oneside \
            TEST_english_oneside_no_number \
            TEST_english_multiline \
            TEST_english_istesqa \
            TEST_english_twoside \
            TEST_german_oneside \
            TEST_german_twoside \
            TEST_english_ustutt \
            TEST_german_ustutt
          do
            pdflatex -interaction=nonstopmode -halt-on-error "$f.tex"
          done
          lualatex -interaction=nonstopmode -halt-on-error TEST_english_tagged.tex
          lualatex -interaction=nonstopmode -halt-on-error TEST_english_tagged.tex
          ! grep "Alternative text for graphic is missing" TEST_english_tagged.log

      - name: Validate tagged PDF against PDF/UA-2
        run: |
          docker run --rm -v "$PWD/tests:/d" verapdf/cli@sha256:c2ac9448973a56acd833c81441e38d2dca58ea26a2ce1621e9a32e85d3d2728f -f ua2 --format text /d/TEST_english_tagged.pdf | tee verapdf.txt
          grep -q '^PASS ' verapdf.txt || { docker run --rm -v "$PWD/tests:/d" verapdf/cli@sha256:c2ac9448973a56acd833c81441e38d2dca58ea26a2ce1621e9a32e85d3d2728f -f ua2 --format text --verbose /d/TEST_english_tagged.pdf; exit 1; }

      - name: Assemble site
        run: |
          mkdir build
          cp README.md tests/*.pdf .github/_config.yml demo.pdf build/

      - name: Upload PDFs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdfs
          path: build

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          enable_jekyll: true
